[package]
name = "tidal-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A lightweight, distraction-free TIDAL client for Windows"
build = "build.rs"

[lib]
name = "tidal_rs"
path = "src/lib.rs"

[[bin]]
name = "tidal-rs"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.9.0"
rodio = "=0.23.0"
keyring = "=4.2.0"
rust-i18n = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset", "json", "form", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
futures = "0.3"
getrandom = "0.4"
sha2 = "0.11"
fastrand = "2"
thiserror = "2"
anyhow = "1"
directories = "6"
sys-locale = "0.3"
base64 = "0.23"
quick-xml = "0.42"
url = { version = "2", features = ["serde"] }
open = "5"
toml = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Media", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "thin"
